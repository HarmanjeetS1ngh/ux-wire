name: Daily fetch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run the fetch script
        run: npm run fetch

      - name: Commit updated digest (if anything changed)
        run: |
          git config user.name "ux-pulse-bot"
          git config user.email "actions@github.com"
          git add data/digest.json
          if git diff --cached --quiet; then
            echo "No new items today."
          else
            git commit -m "Daily update: $(date -u +'%Y-%m-%d')"
            git push
          fi
